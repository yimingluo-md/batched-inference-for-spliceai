name: Publish audited source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace bootstrap history with audited source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir /tmp/audited-source
          tar -xzf source-v2.tar.gz -C /tmp/audited-source
          cd /tmp/audited-source
          git init -b main
          git config user.name "Yiming Luo"
          git config user.email "yimingluo-md@users.noreply.github.com"
          git add -A
          git commit -s -m "Publish audited batched inference source"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin main
